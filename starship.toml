# This file is auto-generated by matugen, changes need to be made in the template file in .config/matugen/templates or will be overridden on changing the theme / wallpaper

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[\ue0b6](fg:color_bg0)\
$os\
$username\
[](bg:color_bg1 fg:color_bg0)\
$directory\
[](fg:color_bg1 bg:color_bg2)\
$git_branch\
$git_status\
[](fg:color_bg2 bg:color_bg3)\
$nix_shell\
$shell\
[](fg:color_bg3 bg:color_bg4)\
$docker_context\
$conda\
$pixi\
[](fg:color_bg4 bg:color_bg5)\
$time\
[](fg:color_bg5)\
$line_break$character"""

palette = 'matugen'

[palettes.matugen]
color_success = '#91cef4'
color_error = '#ffb4ab'
color_bg0 = '#91cef4'
color_fg0 = '#00344a'
color_bg1 = '#b6c9d8'
color_fg1 = '#20333e'
color_bg2 = '#cbc1e9'
color_fg2 = '#332c4c'
color_bg3 = '#313539'
color_fg3 = '#dfe3e7'
color_bg4 = '#1c2023'
color_fg4 = '#dfe3e7'
color_bg5 = '#181c1f'
color_fg5 = '#dfe3e7'

[os]
disabled = false
style = "bg:color_bg0 fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Arch = "󰣇"
Artix = "󰣇"
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:color_bg0 fg:color_fg0"
style_root = "bg:color_bg0 fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg1 bg:color_bg1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol $branch ](fg:color_fg2 bg:color_bg2)]($style)'

[git_status]
style = "bg:color_bg2"
format = '[[($all_status$ahead_behind )](fg:color_fg2 bg:color_bg2)]($style)'

[shell]
disabled = false
style = "bg:color_bg3"
format = '[[ $indicator ](fg:color_fg3 bg:color_bg3)]($style)'

[nix_shell]
disabled = false
style = "bg:color_bg3"
format = '[ $symbol](fg:color_fg3 bg:color_bg3)' # just the flake, in front of the shell's name
symbol = '[󱄅](fg:color_fg3 bg:color_bg3)'

[nodejs]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg3 bg:color_bg3)]($style)'

[bun]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg3 bg:color_bg3)]($style)'

[c]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg3 bg:color_bg3)]($style)'

[cpp]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg3 bg:color_bg3)]($style)'

[rust]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg3 bg:color_bg3)]($style)'

[python]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg3 bg:color_bg3)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg4"
format = '[[ $symbol( $context) ](fg:color_fg4 bg:color_bg4)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg5"
format = '[[ $time ](fg:color_fg5 bg:color_bg5)]($style)'

[line_break]
disabled = false

[character]
success_symbol = "[ ](bold fg:color_success)"
error_symbol = "[ ](bold fg:color_error)"

# This file is auto-generated by matugen, changes need to be made in the template file in .config/matugen/templates or will be overridden on changing the theme / wallpaper
