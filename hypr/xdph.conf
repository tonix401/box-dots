# xdg-desktop-portal-hyprland: read on portal start (restart it after edits)
screencopy {
    # Quickshell share menu instead of hyprland-share-picker (falls back to it when the shell isn't running)
    custom_picker_binary = /home/tom/.config/hypr/scripts/share-picker.sh
    # "Remember this choice" starts switched on (the picker gets --allow-token)
    allow_token_by_default = true
}
