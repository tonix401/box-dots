<?xml version="1.0" encoding="UTF-8"?>
<!--
  The cat avatar's rig: the source of truth for the terminal-pet cats and the Quickshell desktop cat.
  See SPEC.md. build.py turns this into rig.json and the matugen templates; never edit those by hand.

  - A part is a <g id="…" data-pivot="x y">; parts nest (a child moves with its parent).
  - A part either holds its paths directly, or <g data-variant="name"> groups to choose between
    (the first is the default).
  - <g data-key="name"> inside a part is a shape key: the same paths in the same order with the
    same commands, moved. Hidden here; renderers blend towards it by a weight.
  - <g data-key="name" data-tip="degrees scale" /> (empty) is a hinge key, computed by build.py: the
    part's first path is a flap (an ear) whose endpoints stay put; its tip (the point farthest from the
    line between them) turns that far about their midpoint and moves that much closer, and one affine
    map taking the endpoints to themselves and the tip there moves every path of the part. So the whole
    ear moves as one piece and stays joined to the head.
  - data-chain/data-chain-index stitch paths back into one for the exports (the head outline).
  - data-skin="bone" data-skin-y="y0 y1" on a part: its points follow the bone part (fully at y <= y0,
    not at all at y >= y1, smoothly between), so the body stays joined to the head when it moves.
  - class: "line" = miter joins, "line-join"/"ear" = round joins, "filled" = filled with the stroke color,
    "solid" = filled without a stroke, "blush" = a faint fill, "hole" = cut out of the shape before it.
-->
<svg width="100mm" height="100mm" viewBox="0 0 130.7191 134.00444" xmlns="http://www.w3.org/2000/svg">
  <style>
    path, ellipse { stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }
    .line-join, .ear { stroke-linejoin: round; }
    .filled { fill: currentColor; }
    .solid, .blush { fill: currentColor; stroke: none; }
    .blush { fill-opacity: 0.35; }
    .hole { fill: white; stroke: none; }
  </style>
