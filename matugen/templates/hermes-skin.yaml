  ui_warn: "{{ colors.tertiary.default.hex }}"
  prompt: "{{ colors.on_background.default.hex }}"
  input_rule: "{{ colors.outline_variant.default.hex }}"
  response_border: "{{ colors.primary.default.hex }}"
  status_bar_bg: "{{ colors.surface_container_low.default.hex }}"
